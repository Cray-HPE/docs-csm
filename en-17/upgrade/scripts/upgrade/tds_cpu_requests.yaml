spec:
  kubernetes:
    services:
      cray-spire:
        cray-postgresql:
          sqlCluster:
            resources:
              requests:
                cpu: "1"
      cray-dhcp-kea:
        cray-service:
          containers:
            cray-dhcp-kea:
              resources:
                requests:
                  cpu: "500m"
        cray-postgresql:
          sqlCluster:
            resources:
              requests:
                cpu: "1"
      cray-hms-smd:
        cray-postgresql:
          sqlCluster:
            resources:
              requests:
                cpu: "1"
        cray-service:
          containers:
            cray-smd:
              resources:
                requests:
                  cpu: "1"
      cray-nexus:
        sonatype-nexus:
          nexus:
            resources:
              requests:
                cpu: "2"
      cray-metallb:
        metallb:
          speaker:
            resources:
              requests:
                cpu: "1"
          controller:
            resources:
              requests:
                cpu: "100m"
      cray-hms-capmc:
        cray-service:
          containers:
            cray-capmc:
              resources:
                requests:
                  cpu: "500m"
      cray-istio-ingress:
        deployments:
          istio-ingressgateway:
            resources:
              requests:
                cpu: "250m"
          istio-ingressgateway-customer-admin:
            resources:
              requests:
                cpu: "100m"
          istio-ingressgateway-customer-user:
            resources:
              requests:
                cpu: "100m"
          istio-ingressgateway-hmn:
            resources:
              requests:
                cpu: "150m"
      cray-keycloak:
        keycloak:
          resources:
            requests:
              cpu: "20m"
      cray-kyverno:
        kyverno:
          admissionController:
            container:
              resources:
                requests:
                  cpu: "1"
          reportsController:
            resources:
              requests:
                cpu: "20m"
          cleanupController:
            resources:
              requests:
                cpu: "20m"
          backgroundController:
            resources:
              requests:
                cpu: "20m"
      cray-opa:
        opa:
          resources:
            requests:
              cpu: "10m"
      cray-sysmgmt-health:
        victoria-metrics-k8s-stack:
          prometheus-node-exporter:
            resources:
              requests:
                cpu: "10m"
      sma-elasticsearch:
        resources:
          requests:
            cpu: "1500m"
      sma-zk-kafka:
        kafkaReqCPU: "1"
        zkReqCPU: "100m"
      sma-grafana:
        cray-service:
          containers:
            sma-grafana:
              resources:
                requests:
                  cpu: "100m"
      sma-kibana:
        cray-service:
          containers:
            sma-kibana:
              resources:
                requests:
                  cpu: "100m"
      sma-dashboards:
        cray-service:
          containers:
            sma-dashboards:
              resources:
                requests:
                  cpu: "100m"
      sma-postgres-cluster:
        pgReqCPU: "500m"
      cray-dns-unbound:
        resources:
          cray-dns-unbound:
            requests:
              cpu: "500m"
