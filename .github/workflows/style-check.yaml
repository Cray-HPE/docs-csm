name: Markdown stylecheck

on:
  pull_request:

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v46
      with:
        files: "**/*.md"
        files_ignore: |
          .github/**/*
          api/*

    - uses: docker://ghcr.io/igorshubovych/markdownlint-cli:v0.32.0
      with:
        args: "--config .github/config/markdown_style.yaml ${{ steps.changed-files.outputs.all_changed_files }}"

    - name: Check for illegal ASCII
      id: illegal-ascii
      run: |
        ./runLint.sh
