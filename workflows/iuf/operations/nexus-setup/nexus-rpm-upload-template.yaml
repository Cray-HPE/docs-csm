apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nexus-rpm-upload
  namespace: argo
spec:
  entrypoint: main
  templates:
### Main Steps ###
  - name: main
    inputs:
      parameters:
        - name: auth_token
        - name: global_params
    steps:
    - - name: start-operation
        templateRef:
          name: workflow-template-record-time-template
          template: record-time-template
    - - name: nexus-get-prerequisites
        templateRef:
          name: nexus-get-prerequisites-template
          template: nexus-get-prerequisites
        arguments:
          parameters:
          - name: global_params
            value: "{{inputs.parameters.global_params}}"
    - - name: nexus-rpm-load
        template: nexus-rpm-load-template
        hooks:
          exit:
            templateRef:
              name: cleanup-nexus-admin-credential-template
              template: cleanup-nexus-admin-credential
            arguments:
              parameters:
              - name: nexus_admin_credential_secret_name
                value: "{{steps.nexus-get-prerequisites.outputs.parameters.secret_name}}"
        arguments:
          parameters:
          - name: nexus_setup_image
            value: artifactory.algol60.net/csm-docker/stable/cray-nexus-setup:0.11.1
          - name: nexus_admin_credential_secret_name
            value: "{{steps.nexus-get-prerequisites.outputs.parameters.secret_name}}"
          - name: content
            value: "{{steps.nexus-get-prerequisites.outputs.parameters.current_product_manifest}}"
          - name: product_directory
            value: "{{steps.nexus-get-prerequisites.outputs.parameters.product_directory}}"
    - - name: end-operation
        templateRef:
          name: workflow-template-record-time-template
          template: record-time-template

### Templates ###
## nexus-rpm-load-template ##
  - name: nexus-rpm-load-template
    inputs:
      parameters:
      - name: nexus_setup_image
      - name: nexus_admin_credential_secret_name
      - name: content
      - name: product_directory
    tolerations:
    - key: node-role.kubernetes.io/master
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    script:
      image: "{{inputs.parameters.nexus_setup_image}}"
      command: [iuf-rpm-upload]
      args: ["{{inputs.parameters.content}}"]
      env:
      - name: NEXUS_URL
        value: "https://packages.local"
      - name: NEXUS_USERNAME
        valueFrom:
          secretKeyRef:
            name: "{{inputs.parameters.nexus_admin_credential_secret_name}}"
            key: username
      - name: NEXUS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: "{{inputs.parameters.nexus_admin_credential_secret_name}}"
            key: password
      volumeMounts:
      - name: product
        mountPath: /images
    # This will be an RBD mount.
    volumes:
    - name: product
      hostPath:
        path: "{{inputs.parameters.product_directory}}"
