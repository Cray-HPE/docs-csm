apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: migrate-cilium 
  namespace: argo
spec:
  entrypoint: main
  templates:
    - name: main
      inputs:
        parameters:
          - name: targetNcn
          - name: dryRun
      dag:
        tasks:
        - name: cordon 
          templateRef:
            name: kubectl-and-curl-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  kubectl get node {{inputs.parameters.targetNcn}} || res=$?
                  # only delete a ncn that exists in cluster
                  if [[ $res -eq 0 ]]; then
                    kubectl cordon {{inputs.parameters.targetNcn}}
                  fi
        - name: drain
          dependencies:
            - cordon 
          templateRef:
            name: kubectl-and-curl-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  export NODE={{inputs.parameters.targetNcn}}
                  kubectl get node $NODE || res=$?
                  # only delete a ncn that exists in cluster
                  if [[ $res -eq 0 ]]; then
                    echo "draining $NODE"
                    # https://jira-pro.it.hpe.com:8443/browse/CASMTRIAGE-8374 - cordon and forcibly remove kafka pods before drain
                    kubectl cordon $NODE
                    kubectl -n services delete pod --field-selector spec.nodeName=$NODE -l app.kubernetes.io/name=kafka
                    kubectl drain --ignore-daemonsets --delete-emptydir-data $NODE
                  fi
        - name: archive-weave-multus
          dependencies:
            - drain
          templateRef:
            name: ssh-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  TARGET_NCN="{{inputs.parameters.targetNcn}}"
                  ssh "${TARGET_NCN}" "if [[ -f /etc/cni/net.d/10-weave.conflist ]]; then mv /etc/cni/net.d/10-weave.conflist /etc/cni/net.d/10-weave.conflist.cilium_bak;fi"
        - name: migrate-multus-config
          dependencies:
            - drain
          templateRef:
            name: ssh-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  TARGET_NCN="{{inputs.parameters.targetNcn}}"
                  MULTUS_CONF=$(ssh "${TARGET_NCN}" cat /srv/cray/resources/common/multus/multus-cilium.conf)
                  ssh "${TARGET_NCN}" "echo '{${MULTUS_CONF}'} > /etc/cni/net.d/00-multus.conf"
        - name: promote-cilium
          dependencies:
            - archive-weave-multus
            - migrate-multus-config
          templateRef:
            name: kubectl-and-curl-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  echo "promoting cilium on {{inputs.parameters.targetNcn}}"
                  export NODE={{inputs.parameters.targetNcn}}
                  kubectl label node $NODE --overwrite "io.cilium.migration/cilium-default=true"
                  kubectl -n kube-system delete pod --field-selector spec.nodeName=$NODE -l k8s-app=cilium
                  kubectl -n kube-system rollout status ds/cilium -w
        - name: restart-daemonsets 
          dependencies:
            - promote-cilium 
          templateRef:
            name: ssh-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  echo "restarting daemonsets on {{inputs.parameters.targetNcn}}"
                  NODE={{inputs.parameters.targetNcn}}
                  kubectl get node ${NODE} >/dev/null 2>&1 || { echo "Error: Invalid node name ${NODE}"; exit 1; }

                  while read -r ns pod; do
                    echo "Restarting pod $pod"
                    kubectl -n $ns delete pod $pod
                  done < <(kubectl get pods -A -o json | jq -j --arg n "$NODE" '.items[] | select (.spec.nodeName==$n) | select(.spec.hostNetwork!=true) |.metadata.namespace, " ", .metadata.name, "\n"')
        - name: uncordon 
          dependencies:
            - restart-daemonsets 
          templateRef:
            name: kubectl-and-curl-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  kubectl uncordon {{inputs.parameters.targetNcn}}
        - name: wait-for-pods 
          dependencies:
            - uncordon 
          templateRef:
            name: ssh-template
            template: shell-script
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: scriptContent
                value: |
                  echo "waiting for pods to start" 
                  cilium status --wait
                  sleep 60
        - name: validate 
          dependencies:
          - wait-for-pods 
          templateRef:
              name: post-cilium-migrate-healthcheck
              template: main
          arguments:
            parameters:
              - name: dryRun
                value: "{{inputs.parameters.dryRun}}"
              - name: targetNcn
                value: "{{inputs.parameters.targetNcn}}" 
